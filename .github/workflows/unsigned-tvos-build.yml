name: Unsigned tvOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      SILO_CACHE_NAMESPACE: development
      SILO_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/.ci-cache/packages
      MARKETING_VERSION: 1.0.0
      BUILD_NUMBER: ${{ github.run_number }}
      SILO_RELEASE_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Install XcodeGen
        uses: ./.github/actions/install-xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build unsigned tvOS IPA
        run: bundle exec fastlane ios ipa_tvos_unsigned

      - name: Upload unsigned tvOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SiloTV-tvOS-unsigned-ipa
          path: build/tvos-unsigned/SiloTV-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
